server {
  listen 3000;
  listen [::]:3000;
  server_name app.nuttywonders.com;

  root /usr/share/nginx/html;
  index admin.html;

  # The app subdomain is the internal studio. Keep the catalog and admin
  # assets available, but make the studio the default entry point.
  location / {
    try_files $uri $uri/ /admin.html;
  }

  location ~* \.(css|js|png|jpe?g|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}

server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  server_name www.nuttywonders.com nuttywonders.com _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|png|jpe?g|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
