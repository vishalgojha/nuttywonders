# NuttyWonders on Coolify: the storefront (this nginx) and the Go bridge run
# as separate Coolify apps, so the bridge is reached over its public FQDN.
resolver 127.0.0.11 valid=30s;

# app.nuttywonders.com is the Studio (admin console); every other host
# (www and the bare domain) is the customer storefront.
map $host $home_page {
  default              /index.html;
  app.nuttywonders.com /admin.html;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;

  # Everything the Go bridge owns. Never cached, never served as files.
  location /api/ {
    set $bridge_upstream api.nuttywonders.com;
    proxy_pass https://$bridge_upstream$request_uri;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    # Cloudflare/Traefik route on Host; we must present the bridge's own
    # hostname here, otherwise the request is routed back to this nginx
    # and loops forever.
    proxy_set_header Host api.nuttywonders.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
    proxy_connect_timeout 10s;
  }

  location /healthz {
    set $bridge_upstream api.nuttywonders.com;
    proxy_pass https://$bridge_upstream/api/health;
    proxy_ssl_server_name on;
    access_log off;
  }

  # The Studio lives only on app.nuttywonders.com. Anyone opening its URLs
  # on a storefront host is sent to the Studio host instead.
  location = /admin {
    if ($host != app.nuttywonders.com) { return 301 https://app.nuttywonders.com/admin.html; }
    return 301 /admin.html;
  }
  location = /studio {
    if ($host != app.nuttywonders.com) { return 301 https://app.nuttywonders.com/admin.html; }
    return 301 /admin.html;
  }
  location = /admin.html {
    if ($host != app.nuttywonders.com) { return 301 https://app.nuttywonders.com/admin.html; }
    try_files /admin.html =404;
    add_header Cache-Control "no-cache" always;
  }

  # Product landing routes keep a readable URL while the page loads the
  # current catalog record and fills its metadata and Product JSON-LD.
  location ^~ /products/ {
    try_files $uri /product.html;
  }

  location ^~ /journal/ {
    try_files $uri /journal.html;
  }

  # "/" resolves to the Studio on app.* and the storefront everywhere else.
  location = / {
    try_files $home_page =404;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # HTML, CSS and JS must revalidate on every load. Without this a deploy
  # stays invisible for the browser cache lifetime — scripts were previously
  # cached for 7 days, which left visitors running an old bundle whose
  # buttons did nothing.
  location ~* \.(html|css|js)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Images and fonts are content-stable, so cache them hard.
  location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location ~ /\. { deny all; }
}
