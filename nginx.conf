# NuttyWonders on Coolify: the storefront (this nginx) and the Go bridge run
# as separate Coolify apps, so the bridge is reached over its public FQDN.
resolver 127.0.0.11 valid=30s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;

  # Everything the Go bridge owns. Never cached, never served as files.
  location /api/ {
    set $bridge_upstream api.nuttywonders.com;
    proxy_pass https://$bridge_upstream$request_uri;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
    proxy_connect_timeout 10s;
  }

  location /healthz {
    set $bridge_upstream api.nuttywonders.com;
    proxy_pass https://$bridge_upstream/api/health;
    proxy_ssl_server_name on;
    access_log off;
  }

  location = /admin { return 301 /admin.html; }
  location = /studio { return 301 /admin.html; }

  # The storefront and the studio are separate entry points on the same host.
  location = / { try_files /index.html =404; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location ~ /\. { deny all; }
}